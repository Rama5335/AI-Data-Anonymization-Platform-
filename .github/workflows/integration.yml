name: integration

# Live MSSQL + Ollama integration. Triggered manually or weekly
# (cron). Heavy: starts Docker MSSQL, pulls qwen2.5:7b-instruct,
# runs the full validate_phase*.ps1 stack.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pull Ollama model
        run: |
          docker run -d --rm --name ollama -p 11434:11434 \
            -v ollama-data:/root/.ollama ollama/ollama:0.3.12
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          docker exec ollama ollama pull qwen2.5:7b-instruct
      - name: Run live validators
        working-directory: backend
        env:
          LLM_PROVIDER: ollama
          OLLAMA_MODEL: qwen2.5:7b-instruct
          OLLAMA_BASE_URL: http://127.0.0.1:11434
        run: |
          pwsh -NoProfile -Command "./scripts/validate_phase3.ps1; ./scripts/validate_phase4.ps1; ./scripts/validate_phase5.ps1; ./scripts/validate_phase6.ps1; ./scripts/validate_phase9.ps1"
      - name: Cleanup
        if: always()
        run: |
          docker rm -f ollama || true
          docker volume rm -f ollama-data || true
